name: Build base-deps images

on:
  push:
    branches: [master, main]
    paths:
      - 'docker/Dockerfile.base-deps-*'
      - 'docker/Dockerfile.innosetup-base'
      - '.github/workflows/base-deps.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # qt68-bookworm-arm64 собирается ЛОКАЛЬНО на arm64-машине и пушится
  # вручную (см. docker/Dockerfile.qt68-bookworm-arm64). CI его только тянет.
  QT68_IMAGE: ghcr.io/dimgrig/qt68-bookworm-arm64:6.8.5

jobs:
  build-base-deps:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name:     linux-qt5
            dockerfile: Dockerfile.base-deps-linux
            image:    core-base-deps-linux
            tag:      qt5-bookworm
            runner:   ubuntu-latest
            platforms: linux/amd64
            extra_build_args: ''

          - name:     linux-qt6
            dockerfile: Dockerfile.base-deps-linux-qt6
            image:    core-base-deps-linux
            tag:      qt6-bookworm
            runner:   ubuntu-latest
            platforms: linux/amd64
            extra_build_args: ''

          - name:     win-qt5
            dockerfile: Dockerfile.base-deps-win
            image:    core-base-deps-win
            tag:      qt5-mingw
            runner:   ubuntu-latest
            platforms: linux/amd64
            extra_build_args: ''

          - name:     win-qt6
            dockerfile: Dockerfile.base-deps-win64-qt6
            image:    core-base-deps-win64
            tag:      qt6-mingw
            runner:   ubuntu-latest
            platforms: linux/amd64
            extra_build_args: ''

          - name:     arm64-qt5
            dockerfile: Dockerfile.base-deps-arm64
            image:    core-base-deps-arm64
            tag:      qt5-bookworm
            runner:   ubuntu-24.04-arm
            platforms: linux/arm64
            extra_build_args: ''

          - name:     arm64-qt6
            dockerfile: Dockerfile.base-deps-arm64-qt6
            image:    core-base-deps-arm64
            tag:      qt6-bookworm-aqt
            runner:   ubuntu-24.04-arm
            platforms: linux/arm64
            extra_build_args: "QT68_IMAGE=ghcr.io/dimgrig/qt68-bookworm-arm64:6.8.5"

          - name:     armv7-qt5
            dockerfile: Dockerfile.base-deps-armv7
            image:    core-base-deps-armv7
            tag:      qt5-bullseye
            runner:   ubuntu-latest
            platforms: linux/arm/v7
            extra_build_args: ''

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (только armv7)
        if: matrix.platforms == 'linux/arm/v7'
        uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify qt68 image is pullable
        if: matrix.name == 'arm64-qt6'
        run: |
          docker pull "${{ env.QT68_IMAGE }}" || {
            echo "ERROR: cannot pull ${{ env.QT68_IMAGE }}" >&2
            echo "" >&2
            echo "Make sure:" >&2
            echo "  1. qt68-bookworm-arm64:6.8.5 was pushed (Actions → 'Build qt68-bookworm-arm64')" >&2
            echo "  2. Package visibility is Public in ghcr.io/settings/packages" >&2
            exit 1
          }

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ matrix.tag }}
          build-args: ${{ matrix.extra_build_args }}
          secrets: |
            GIT_AUTH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha,scope=base-deps-${{ matrix.name }}
          cache-to:   type=gha,mode=max,scope=base-deps-${{ matrix.name }}

  build-innosetup-base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.innosetup-base
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/innosetup-base:latest
          cache-from: type=gha,scope=innosetup-base
          cache-to:   type=gha,mode=max,scope=innosetup-base